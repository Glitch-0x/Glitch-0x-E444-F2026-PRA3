{% extends "base.html" %}

{% block title %}Flasky - Chatbot{% endblock %}

{% block page_content %}
<div class="page-header clearfix">
    <h1 class="pull-left">Welcome to the Chatbot, {{ name if name else 'User' }}!</h1>
    <!-- Logout Button -->
    <a href="{{ url_for('logout') }}" class="btn btn-danger pull-right" style="margin-top: 20px;">Logout</a>
</div>

<form method="POST" action="{{ url_for('chat') }}">
    <div class="form-group">
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" class="form-control" placeholder="Type 'hello'..." required>
    </div>
    <button type="submit" class="btn btn-primary">Send</button>
</form>

{% if reply %}
    <hr>
    <h3>Chatbot Reply:</h3>
    <div class="well">
        <p>{{ reply }}</p>
    </div>
{% endif %}
{% endblock %}
